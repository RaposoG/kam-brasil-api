[package]
name = "launcher"
version = "1.2.2"
description = "Launcher do Kam Brasil"
authors = ["Kam Brasil"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rustls em vez do TLS da plataforma: mesmo comportamento no Windows e no Linux,
# sem depender de SChannel/OpenSSL do sistema.
# webpki-roots embute a store de certificados: mesmo comportamento em qualquer
# maquina, sem depender do que o SO tem instalado.
# http2 importa aqui: a release tem 8447 arquivos e 79% deles nao chegam a
# 10 KB. Com HTTP/1.1 cada um custa uma ida-e-volta; com h2 eles multiplexam
# numa conexao so.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2"] }

# Guarda o token no cofre do sistema (Gerenciador de Credenciais no Windows).
# Os backends de Windows, macOS e Linux ja vem habilitados por padrao.
keyring = "4"

# Verificacao de integridade do cliente baixado.
sha2 = "0.10"

# Instalacao do zero vem num zip so. Sem ele seriam 8447 requisicoes, e as
# extensoes do KaM (.libx, .dat, .script, .map) nao estao na lista de
# cacheaveis do Cloudflare -- cada uma ia ate o VPS, a ~1s de ida e volta.
zip = "8.6.0"

# Decodificador MP2 em Rust puro. As vozes das unidades do KaM original sao
# .snd, que e MPEG-1 Layer II; o jogo so aceita .wav. Sem isto as tropas ficam
# mudas. Rust puro evita depender de DLL de audio na maquina do jogador.
symphonia = { version = "0.6.1", default-features = false, features = ["mp2"] }

# Localiza a pasta Documentos respeitando redirecionamento (OneDrive, por
# exemplo). Hardcodar %USERPROFILE%\Documents erraria nessas maquinas.
dirs = "6"

# fs/io assincronos para o download, e sync/time/rt para baixar em paralelo.
# O Tauri ja usa tokio; declaramos as features que precisamos em vez de depender
# das dele por acaso.
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt"] }
tauri-plugin-dialog = "2.7.2"

# Auto-atualizacao do proprio launcher.
#
# Todo pacote e assinado e a chave publica fica embutida no binario. Isso importa
# porque o endpoint de update e uma URL na internet: sem assinatura, quem
# conseguisse responder por ela empurraria um executavel qualquer para todos os
# jogadores. Com assinatura, o pior que consegue e servir um arquivo recusado.
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
# Runtime para os testes de integracao de auth.rs (rodam com --ignored).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
