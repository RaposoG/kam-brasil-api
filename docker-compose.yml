# Sobe a plataforma inteira: API + Postgres + os DOIS servidores de jogo.
#
# O banco NAO e exposto para fora. A API fala com ele pelo nome do servico, na
# rede interna do compose -- por isso nao ha nada de Postgres para voce
# configurar. Quem precisar inspecionar usa:
#
#   docker compose exec postgres psql -U kambrasil -d kambrasil
#
# Em producao, preencha .env com JWT_SECRET, ADMIN_TOKEN e POSTGRES_PASSWORD.
#
# ---------------------------------------------------------------------------
# TOPOLOGIA DE REDE -- leia antes de mexer, e uma linha errada aqui derruba a
# plataforma inteira:
#
# REDES: nenhuma declarada, de proposito. O Dokploy reescreve a chave `networks:`
# do servico com dominio ao injetar a rede do Traefik -- em todas as stacks desta
# maquina ele grava exatamente [dokploy-network, default]. Declarar rede nossa
# seria apostar que ele acrescenta em vez de substituir; se substituir, os
# gameservers ficam sem rota ate a API e ninguem entra em servidor nenhum, nem no
# casual, com a plataforma de pe fingindo que esta tudo bem.
#
# Com a chave ausente, o Dokploy faz o que ja faz hoje e todo mundo cai na
# `default`. A API reconhece os gameservers pelo NOME do servico, resolvido pelo
# DNS do Docker -- ver ANNOUNCE_ALLOWED_IPS mais abaixo e api/src/allowlist.ts.

services:
  postgres:
    image: postgres:18
    container_name: kambrasil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kambrasil
      # Default so serve porque o banco nao tem porta publicada: e alcancavel
      # apenas de dentro da rede do compose. Em producao, defina no .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kambrasil-interno}
      POSTGRES_DB: kambrasil
    volumes:
      # PG18 mudou o VOLUME de /var/lib/postgresql/data para /var/lib/postgresql
      # (o PGDATA real vive em 18/docker). Montar no caminho antigo NAO persiste.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kambrasil -d kambrasil"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: kambrasil-api
    restart: unless-stopped
    depends_on:
      postgres:
        # Espera o banco aceitar conexao. Sem isto a API sobe primeiro, falha na
        # migration e reinicia em loop ate dar sorte.
        condition: service_healthy
    # AS DUAS REDES, e nesta ordem:
    # Sem bloco `networks:` de proposito. O Dokploy reescreve esta chave ao
    # injetar a rede do Traefik -- em TODAS as stacks desta maquina ele grava
    # exatamente `[dokploy-network, default]`. Declarar uma rede nossa aqui e
    # apostar que ele acrescenta em vez de substituir, e se ele substituir os
    # gameservers ficam sem rota ate a API: ninguem entra em servidor nenhum,
    # nem no casual, e a plataforma continua de pe fingindo que esta tudo bem.
    #
    # Todo mundo na `default` e o allowlist por NOME DE SERVICO (ver abaixo)
    # tornam a pergunta irrelevante.
    environment:
      # "postgres" e o nome do servico: resolvido pelo DNS interno do compose.
      DATABASE_URL: postgres://kambrasil:${POSTGRES_PASSWORD:-kambrasil-interno}@postgres:5432/kambrasil
      NODE_ENV: production
      API_PORT: 3000
      API_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      PLAY_TICKET_TTL_MINUTES: ${PLAY_TICKET_TTL_MINUTES:-720}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Quem tem o painel administrativo. Concedido no deploy de proposito: o
      # acesso fica versionado e auditavel, sem SQL na mao. Vazio = ninguem.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      MOTD: ${MOTD:-Bem-vindo ao Kam Brasil!}
      # Atras de nginx/Cloudflare tem que ser true, senao request.ip devolve o IP
      # do proxy e o log e o rate-limit viram enfeite. Os allowlists abaixo NAO
      # dependem disto: eles olham o socket, nao o X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Quem pode anunciar servidor e verificar ticket: os NOMES dos servicos,
      # nao IPs. O DNS embutido do Docker resolve nome de servico e so conhece
      # este projeto -- ninguem na internet faz `gameserver` apontar para si.
      #
      # Nome, e nao IP fixo, porque IP fixo exigiria subnet propria, e subnet
      # propria exige declarar `networks:` na API -- que e justamente o que o
      # Dokploy reescreve (ver o comentario la em cima).
      #
      # Valor literal, e nao ${...}: um valor velho no painel do Dokploy (o
      # antigo "127.0.0.1") sobreporia o default e desligaria anuncio e
      # /auth/verify EM SILENCIO. E nunca ponha faixa: nao ha CIDR aqui, e
      # liberar 172.16/12 deixaria passar o Traefik -- ou seja, a internet.
      ANNOUNCE_ALLOWED_IPS: gameserver,gameserver-ranked
      VERIFY_ALLOWED_IPS: gameserver,gameserver-ranked
      # Ranqueada ligada por padrao. RANKED_ENABLED=false desliga fila,
      # pareamento e tempo real -- historico e perfil seguem de pe.
      RANKED_ENABLED: ${RANKED_ENABLED:-true}
      # Em qual porta atende o servidor de RANQUEADA. E como a API escolhe entre
      # os dois servidores anunciados: sem isto ela pegaria "o dedicado que
      # anunciou por ultimo", ou seja, sorteio entre o casual e o ranqueado.
      #
      # A MESMA variavel alimenta o SERVER_PORT do gameserver-ranked, embaixo:
      # um valor so, impossivel de dessincronizar.
      RANKED_SERVER_PORT: ${RANKED_SERVER_PORT:-56790}
      # O mesmo segredo tem que chegar aos dois lados. Ninguem precisa definir:
      # a API sorteia 32 bytes na primeira subida e grava neste arquivo, e o
      # entrypoint do gameserver-ranked le o mesmo caminho no volume
      # compartilhado. O gameserver casual nao monta esse volume.
      #
      # Definir RANKED_INTERNAL_SECRET a mao continua valendo e tem precedencia.
      RANKED_SECRET_FILE: /app/shared/ranked-secret
      RANKED_INTERNAL_SECRET: ${RANKED_INTERNAL_SECRET:-}
      RANKED_ALLOWED_EXE_CRCS: ${RANKED_ALLOWED_EXE_CRCS:-}
      RANKED_TICK_MS: ${RANKED_TICK_MS:-3000}
      RANKED_BAN_TURNO_SEG: ${RANKED_BAN_TURNO_SEG:-25}
      # Bloco de salas reservado para o ranqueado, dentro do MAX_ROOMS do
      # gameserver-ranked: indice fora do maximo e sala que nao existe.
      # 0..15, o servidor de ranqueada INTEIRO. O bloco 8-15 de antes existia
      # porque um servidor so dividia casual (0-7) e ranqueada; agora a
      # ranqueada tem container proprio e reservar metade so desperdicava.
      #
      # Capacidade importa: 30 jogadores em 1v1 querem 15 salas, e com 8 os
      # lobbies excedentes esperam -- e `abortarLobbiesTravados` derruba quem
      # passa do prazo, abortando gente que so estava na fila por capacidade.
      RANKED_ROOM_FIRST: ${RANKED_ROOM_FIRST:-0}
      RANKED_ROOM_COUNT: ${RANKED_ROOM_COUNT:-16}
      # Endereco que vai para a lista de servidores. Sem ele os jogadores
      # recebem o IP interno do container e nao conectam em nada -- mas a API
      # sobe assim mesmo, e avisa no log.
      #
      # Ja foi obrigatorio (`:?`) e isso derrubou a plataforma inteira: sem a
      # variavel o compose recusava subir, e conta, login e download caiam junto
      # por causa de um endereco que so afeta a lista de servidores.
      #
      # UM valor para os DOIS servidores, e esta certo assim: os dois rodam na
      # mesma maquina, no mesmo IP publico, e o que os distingue e a PORTA --
      # que cada um manda no proprio anuncio. A chave (ip, port) de game_servers
      # continua separando os dois. Nao precisa virar por servico.
      GAME_SERVER_PUBLIC_ADDRESS: ${GAME_SERVER_PUBLIC_ADDRESS:-}
      SOURCES_DIR: /app/sources
      # Repositorio cujas GitHub Releases carregam os binarios compilados.
      BINARIES_REPO: ${BINARIES_REPO:-RaposoG/kam_brasil}
      # So necessario se BINARIES_REPO for privado.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    # Sem "ports" para a 3000 HTTP: em producao quem roteia e o proxy do Dokploy
    # (Traefik), que alcanca o container pela rede `default` a partir do dominio
    # configurado. Publicar no host colidiria com o painel do proprio Dokploy,
    # que usa a 3000.
    #
    # Em desenvolvimento, docker-compose.override.yml publica a porta. O Compose
    # carrega esse arquivo sozinho quando se roda `docker compose up` sem -f --
    # e o Dokploy passa -f explicito, entao nunca o enxerga.
    expose:
      - "3000"
    ports:
      # HTTP puro para o master server, sem passar pelo Traefik.
      #
      # O cliente do KaM nao fala TLS -- nao existe uma linha de SSL no
      # KM_HTTPClientOverbyte -- e o Traefik do Dokploy responde 308 para HTTPS
      # em qualquer requisicao HTTP. Desligar isso na mao nao adianta: o Dokploy
      # regenera a config a cada deploy e o ajuste some. Ja aconteceu duas vezes.
      #
      # Publicando a porta aqui, a rota fica no nosso compose, versionada, e
      # nenhum deploy a desfaz.
      #
      # A porta do JOGO nao esta mais aqui: cada gameserver publica a propria,
      # agora que nao dividem mais este namespace de rede.
      - "${MASTER_HTTP_PORT:-8081}:3000"
    volumes:
      # Releases sao centenas de MB e vivem em disco, nao no banco. Sem volume,
      # cada rebuild apagaria tudo.
      - releases:/app/releases
      # Cache dos repositorios de conteudo (mapas, textos, sprites). Sem volume,
      # cada release reclonaria centenas de MB em vez de dar um fetch.
      - sources:/app/sources
      # So o segredo interno da ranqueada. Volume proprio, e nao um canto do
      # `sources`, para poder ir read-only no gameserver-ranked: ele le, nunca
      # escreve.
      - ranked-secret:/app/shared
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Servidor CASUAL. Faz exatamente o que o de hoje faz: sala aberta na mao,
  # sem ranqueada nenhuma. Mesma porta de hoje, de proposito -- quem tem o
  # servidor salvo na lista de favoritos do jogo continua conectando.
  # ---------------------------------------------------------------------------
  gameserver:
    build:
      context: ./gameserver
      args:
        # De qual commit do jogo o servidor e compilado. Fixar uma tag aqui
        # torna o build reproduzivel; master pega sempre o mais recente.
        GAME_REF: ${GAME_REF:-master}
    container_name: kambrasil-gameserver
    restart: unless-stopped
    depends_on:
      api:
        # Sem a API de pe o servidor anuncia no vazio e recusa todo mundo que
        # tentar entrar, porque nao consegue verificar ticket nenhum.
        condition: service_healthy
    ports:
      # Agora cada servidor publica a propria porta: eles nao dividem mais o
      # namespace de rede da API. E TCP cru -- o Traefik roteia HTTP, nao serve.
      - "${SERVER_PORT:-56789}:${SERVER_PORT:-56789}"
    # Sem volume `ranked-secret`: este servidor nao tem por que enxergar o
    # segredo, e sem ele nao tem como falar /internal/ranked/* nem por engano.
    environment:
      SERVER_NAME: ${SERVER_NAME:-Kam Brasil}
      SERVER_PORT: ${SERVER_PORT:-56789}
      MAX_ROOMS: ${MAX_ROOMS:-16}
      WELCOME_MESSAGE: ${WELCOME_MESSAGE:-}
      ANNOUNCE_INTERVAL: ${ANNOUNCE_INTERVAL:-180}
      # "api" e o nome do servico, resolvido pelo DNS do compose. O trafego
      # continua sem sair da maquina -- e uma bridge local --, que era toda a
      # razao do 127.0.0.1 de antes: o ticket vai em texto claro na querystring,
      # limitacao do cliente HTTP do Pascal.
      MASTER_SERVER_URL: http://api:3000/
      AUTH_VERIFY_URL: http://api:3000/auth/verify
      # 1 = so entra quem passou pelo launcher, com o nickname da conta.
      REQUIRE_AUTH: ${REQUIRE_AUTH:-1}
      # VAZIO DE PROPOSITO: este e o servidor casual. Vazio aqui faz o
      # entrypoint escrever KamBrasilRankedUrl= vazio no .ini, e o Pascal trata
      # isso como "servidor comum, sem reservas".
      #
      # O entrypoint respeita o vazio explicito (usa ${RANKED_URL-...}, sem
      # dois-pontos, que so cai no default quando a variavel nem existe).
      RANKED_URL: ""
    # E nao ha RANKED_SECRET nem RANKED_SECRET_FILE aqui: mesmo que alguem
    # defina RANKED_INTERNAL_SECRET no .env, este servidor continua casual.

  # ---------------------------------------------------------------------------
  # Servidor de RANQUEADA. So ele fala /internal/ranked/*, so ele enxerga o
  # segredo, e e nele que a API reserva as salas sorteadas.
  #
  # Ele TAMBEM aparece na lista publica de servidores: o endereco que a API usa
  # para mandar os pareados vem do anuncio vivo (serveradd.php), entao ele
  # precisa anunciar. Por isso o nome padrao ja avisa o que ele e.
  # ---------------------------------------------------------------------------
  gameserver-ranked:
    build:
      context: ./gameserver
      args:
        GAME_REF: ${GAME_REF:-master}
    container_name: kambrasil-gameserver-ranked
    restart: unless-stopped
    depends_on:
      api:
        # Alem de precisar da API para verificar ticket, e ela quem grava o
        # arquivo do segredo -- antes de abrir a porta, ou seja, antes de ficar
        # saudavel. Chegar depois e o que faz o segredo estar la.
        condition: service_healthy
    ports:
      - "${RANKED_SERVER_PORT:-56790}:${RANKED_SERVER_PORT:-56790}"
    volumes:
      # :ro porque ele so le. A API escreve.
      - ranked-secret:/app/shared:ro
    environment:
      SERVER_NAME: ${RANKED_SERVER_NAME:-Kam Brasil Ranqueada}
      # A MESMA variavel que a API recebe como RANKED_SERVER_PORT. E assim que
      # a API sabe qual dos dois anuncios e o do servidor ranqueado.
      SERVER_PORT: ${RANKED_SERVER_PORT:-56790}
      # Precisa cobrir RANKED_ROOM_FIRST + RANKED_ROOM_COUNT (8 + 8 = 16 no
      # padrao). Indice de sala fora do maximo e sala que nao existe.
      MAX_ROOMS: ${RANKED_MAX_ROOMS:-16}
      WELCOME_MESSAGE: ${RANKED_WELCOME_MESSAGE:-}
      ANNOUNCE_INTERVAL: ${ANNOUNCE_INTERVAL:-180}
      MASTER_SERVER_URL: http://api:3000/
      AUTH_VERIFY_URL: http://api:3000/auth/verify
      REQUIRE_AUTH: ${REQUIRE_AUTH:-1}
      # Base das rotas internas da ranqueada -- o servidor acrescenta /rooms,
      # /started e /report. Sem sair da maquina pelo mesmo motivo do
      # AUTH_VERIFY_URL: o segredo vai na querystring, em texto claro.
      RANKED_URL: http://api:3000/internal/ranked
      # Vazio de proposito: o entrypoint le o segredo do arquivo que a API
      # gravou. Definir RANKED_INTERNAL_SECRET no .env sobrepoe os dois lados.
      RANKED_SECRET: ${RANKED_INTERNAL_SECRET:-}
      RANKED_SECRET_FILE: /app/shared/ranked-secret

volumes:
  postgres-data:
  releases:
  sources:
  ranked-secret:
